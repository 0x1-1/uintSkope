name: uintSkope CI

# Build and test uintSkope on Windows, Linux and macOS against Qt 6.
on:
  push:
    branches: [ develop, main, master, modernize-uintSkope ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: Windows (MSVC) }
          - { os: ubuntu-latest,  name: Linux (GCC)    }
          - { os: macos-latest,   name: macOS (Clang)  }

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0   # full history so the CMake git-revision step works

      # 6.9: the 6.7 macOS packages still carry '-framework AGL' in Qt6::Gui's
      # link interface, and AGL is gone from the SDK the macOS runner ships.
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.*'
          modules: qtimageformats
          cache: true

      - name: Install Linux build/runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libgl1-mesa-dev libglu1-mesa-dev mesa-common-dev \
            libxkbcommon-x11-0 libxcb-cursor0

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@v6

      # Build through CMakePresets.json (out/build/ci-release). Never configure
      # into build/ — that directory is tracked content (build/VERSION and the
      # build/docsys submodule with nif.xml/kfm.xml).
      - name: Configure
        run: cmake --preset ci-release

      - name: Build
        run: cmake --build --preset ci-release --parallel

      - name: Test
        run: ctest --preset ci-release

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ runner.os }}
          path: |
            out/build/ci-release/**/*.log
            out/build/ci-release/CMakeCache.txt
            out/build/ci-release/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 7
