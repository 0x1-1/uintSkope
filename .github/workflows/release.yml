name: uintSkope Release

# Build packaged, self-contained artifacts and publish a GitHub Release.
# Triggered by pushing a version tag (v*) or manually via workflow_dispatch.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag/name for the release (e.g. v2.0.0)'
        required: true
        type: string

permissions:
  contents: write   # least privilege: needed only to create the Release + upload assets

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows x64
            artifact: uintSkope-windows-x64.zip
          - os: ubuntu-latest
            name: Linux x64
            artifact: uintSkope-linux-x64.tar.gz
          - os: macos-latest
            name: macOS arm64
            artifact: uintSkope-macos-arm64.zip

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          modules: qtimageformats
          cache: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libgl1-mesa-dev libglu1-mesa-dev mesa-common-dev

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Configure & build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DUINTSKOPE_BUILD_TESTS=OFF
          cmake --build build --parallel

      - name: Install (flat, deployed layout)
        run: cmake --install build --prefix dist

      # ---- Package (per OS) ----
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath ${{ matrix.artifact }} -Force
          $h = (Get-FileHash ${{ matrix.artifact }} -Algorithm SHA256).Hash.ToLower()
          "$h  ${{ matrix.artifact }}" | Out-File -Encoding ascii ${{ matrix.artifact }}.sha256

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          # Tarball of the CMake install output. NOTE: Linux artifacts depend on a
          # system Qt 6 + OpenGL runtime (no first-party Qt deploy tool on Linux).
          tar -czf "${{ matrix.artifact }}" -C dist .
          sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          # macdeployqt (run by install) bundles Qt into uintSkope.app, so the zip
          # is self-contained. Single-arch (runner arch); not a universal binary.
          ditto -c -k --keepParent dist/uintSkope.app "${{ matrix.artifact }}"
          shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate combined checksums
        working-directory: artifacts
        run: |
          sha256sum uintSkope-*.zip uintSkope-*.tar.gz 2>/dev/null > SHA256SUMS || true
          echo "=== SHA256SUMS ===" && cat SHA256SUMS

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: uintSkope ${{ github.event.inputs.tag || github.ref_name }}
          draft: true        # publish manually after sanity-checking the assets
          generate_release_notes: true
          files: |
            artifacts/uintSkope-*.zip
            artifacts/uintSkope-*.tar.gz
            artifacts/*.sha256
            artifacts/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
