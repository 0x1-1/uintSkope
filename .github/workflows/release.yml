name: uintSkope Release

# Build packaged, self-contained artifacts and publish a GitHub Release.
# Triggered by pushing a version tag (v*) or manually via workflow_dispatch.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag/name for the release (e.g. v2.0.0)'
        required: true
        type: string

permissions:
  contents: write   # least privilege: needed only to create the Release + upload assets

jobs:
  package:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows x64
            artifact: uintSkope-windows-x64.zip
          - os: ubuntu-latest
            name: Linux x86_64
            artifact: uintSkope-linux-x86_64.AppImage
          - os: macos-latest
            name: macOS arm64
            artifact: uintSkope-macos-arm64.zip

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          modules: qtimageformats
          cache: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libgl1-mesa-dev libglu1-mesa-dev mesa-common-dev

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Configure & build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DUINTSKOPE_BUILD_TESTS=OFF
          cmake --build build --parallel

      - name: Install (flat, deployed layout)
        run: cmake --install build --prefix dist

      # ---- Verify the Qt runtime was actually bundled (windeployqt/macdeployqt
      #      only warn on failure, so a broken, non-launching package could
      #      otherwise be uploaded with the job still green). ----
      - name: Verify Qt runtime is bundled (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path dist/platforms/qwindows.dll)) {
            throw "windeployqt did not stage platforms/qwindows.dll; the package would not launch."
          }
          if (-not (Get-ChildItem dist/Qt6Core.dll -ErrorAction SilentlyContinue)) {
            throw "windeployqt did not stage the Qt6 runtime DLLs."
          }

      - name: Verify Qt runtime is bundled (macOS)
        if: runner.os == 'macOS'
        run: |
          if [ ! -f "dist/uintSkope.app/Contents/PlugIns/platforms/libqcocoa.dylib" ]; then
            echo "macdeployqt did not stage the cocoa platform plugin; the app would not launch." >&2
            exit 1
          fi

      # ---- Package (per OS) ----
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath ${{ matrix.artifact }} -Force
          $h = (Get-FileHash ${{ matrix.artifact }} -Algorithm SHA256).Hash.ToLower()
          "$h  ${{ matrix.artifact }}" | Out-File -Encoding ascii ${{ matrix.artifact }}.sha256

      - name: Package (Linux AppImage)
        if: runner.os == 'Linux'
        env:
          # ubuntu-latest has no FUSE; run the linuxdeploy AppImages by extracting.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set -e
          # Stage the binary + data into an AppDir. The app loads nif.xml / kfm.xml
          # / shaders / style.qss by a path relative to the executable, so they must
          # sit beside the binary (here: AppDir/usr/bin).
          APPDIR="$PWD/AppDir"
          mkdir -p "$APPDIR/usr/bin"
          cp -r dist/. "$APPDIR/usr/bin/"

          # Desktop entry + icon (required by linuxdeploy). Icon basename must match
          # the Icon= key so linuxdeploy can resolve it.
          cp res/nifskope.png uintskope.png
          {
            echo "[Desktop Entry]"
            echo "Type=Application"
            echo "Name=uintSkope"
            echo "Comment=View and edit NetImmerse/Gamebryo NIF, KF, KFM files"
            echo "Exec=uintSkope %F"
            echo "Icon=uintskope"
            echo "Categories=Graphics;3DGraphics;"
            echo "Terminal=false"
          } > uintskope.desktop

          # Fetch linuxdeploy + the Qt plugin (bundles Qt6 into the AppImage).
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

          export QMAKE="${QT_ROOT_DIR}/bin/qmake"
          ./linuxdeploy-x86_64.AppImage \
            --appdir "$APPDIR" \
            --executable "$APPDIR/usr/bin/uintSkope" \
            --desktop-file uintskope.desktop \
            --icon-file uintskope.png \
            --plugin qt \
            --output appimage

          # linuxdeploy names the output from the desktop "Name"; normalize it.
          mv uintSkope*-x86_64.AppImage "${{ matrix.artifact }}"
          sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          # macdeployqt (run by install) bundles Qt into uintSkope.app, so the zip
          # is self-contained. Single-arch (runner arch); not a universal binary.
          ditto -c -k --keepParent dist/uintSkope.app "${{ matrix.artifact }}"
          shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate combined checksums
        working-directory: artifacts
        run: |
          sha256sum uintSkope-*.zip uintSkope-*.AppImage 2>/dev/null > SHA256SUMS || true
          echo "=== SHA256SUMS ===" && cat SHA256SUMS

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: uintSkope ${{ github.event.inputs.tag || github.ref_name }}
          draft: true        # publish manually after sanity-checking the assets
          generate_release_notes: true
          files: |
            artifacts/uintSkope-*.zip
            artifacts/uintSkope-*.AppImage
            artifacts/*.sha256
            artifacts/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
